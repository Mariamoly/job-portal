<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talantebi.ge | AI-Augmented Talents 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --violet: #834DFB;
            --yellow: #F0E100;
            --black: #000000;
            --white: #ffffff;
            --cyan: #00E5FF;
            --aurora: #2EFE9A;
            --lime: #C1FF00;
            --dark-gray: #111111;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--black);
            color: var(--white);
            margin: 0;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(15px);
            background: rgba(0,0,0,0.7);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo { font-weight: 900; font-size: 22px; letter-spacing: -1px; text-transform: uppercase; }
        .logo span { color: var(--violet); }

        .nav-links { display: flex; gap: 30px; }
        .nav-links a { 
            color: var(--white); 
            text-decoration: none; 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            opacity: 0.6; 
            transition: 0.3s; 
        }
        .nav-links a:hover { opacity: 1; color: var(--yellow); }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
            position: relative;
        }

        .modern-date-box { position: relative; margin-bottom: 20px; padding: 10px 20px; overflow: hidden; }
        .date-main {
            font-size: clamp(60px, 8vw, 120px);
            font-weight: 900;
            line-height: 0.8;
            letter-spacing: -4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, var(--white) 50%, rgba(255,255,255,0.1) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            z-index: 2;
        }

        .h-box { display: inline-block; position: relative; margin-bottom: 10px; }
        .h-bg { position: absolute; top: 0; left: -10px; right: -10px; bottom: 0; z-index: -1; transform: skewX(-12deg); }
        h1, h2 { text-transform: uppercase; margin: 0; line-height: 1.1; }
        .section-padding { padding: 120px 8%; }

        .hero h1 { font-size: clamp(35px, 6vw, 85px); letter-spacing: -3px; }

        .hero-desc {
            max-width: 760px;
            font-size: 20px;
            margin-top: 30px;
            opacity: 0.9;
            line-height: 1.8;
        }

        .cta-main {
            margin-top: 50px; padding: 22px 50px; border-radius: 100px; background: var(--violet);
            color: var(--white); font-weight: 900; text-transform: uppercase; text-decoration: none; transition: 0.4s;
        }
        .cta-main:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(131, 77, 251, 0.4); }
    </style>
</head>
<body>

    <nav>
        <div class="logo">TALANTEBI<span>.GE</span></div>
        <div class="nav-links">
            <a href="#model">სპიკერები</a>
            <a href="#audience">ვისთვის არის</a>
            <a href="#benefits">რას მიიღებთ</a>
        </div>
    </nav>

    <section class="hero">
        <div class="modern-date-box">
            <span class="date-main">29 მაისი</span>
        </div>

        <div class="hero-title">
            <div class="h-box">
                <div class="h-bg" style="background: var(--yellow);"></div>
                <h1 style="color: black;">AI-ით გაძლიერებული</h1>
            </div>
            <br>

            <div class="h-box">
                <div class="h-bg" style="background: var(--violet);"></div>
                <h1>ტალანტები</h1>
            </div>
        </div>

        <p class="hero-desc">
            <span style="
                display:inline-flex;
                align-items:center;
                gap:10px;
                background:rgba(131,77,251,0.12);
                border:1px solid rgba(131,77,251,0.35);
                padding:12px 22px;
                border-radius:60px;
                margin-bottom:18px;
                font-size:15px;
                font-weight:800;
                color:var(--yellow);
                letter-spacing:0.5px;
                box-shadow:0 0 25px rgba(131,77,251,0.18);
                backdrop-filter:blur(12px);
            ">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                15:00 • TBC Concept Space
            </span>

            <br>

            კომპანიის AI ტრანსფორმაცია ეფექტურობიდან ინოვაციამდე.
        </p>

        <a href="#model" class="cta-main">გაიგე მეტი</a>
    </section>

</body>
</html>
